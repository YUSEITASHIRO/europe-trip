<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヨーロッパ周遊</title>
<link rel="icon" href="data:,">
<style>
:root{
  --leather:#7a4a2a; --leather-d:#4e2c17; --leather-l:#9a6238;
  --brass:#d4a64a; --brass-d:#8f6a22;
  --lining:#efe4cf; --lining-d:#e2d2b4; --ink:#3a2616; --muted:#7d6249;
  --tag:#f6eedc; --accent:#b0412e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:#2b1d14 radial-gradient(circle at 50% 0,#4a3324,#1d130d 70%) fixed;min-height:100svh;
  color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
main{max-width:980px;margin:0 auto;padding:16px 16px 48px;perspective:1600px}

/* 蓋の裏 */
.lid-in{
  background:repeating-linear-gradient(45deg,var(--lining),var(--lining) 10px,var(--lining-d) 10px,var(--lining-d) 20px);
  border:12px solid var(--leather);border-radius:22px 22px 8px 8px;padding:16px;
  box-shadow:inset 0 0 18px rgba(0,0,0,.25);transform-origin:50% 100%;animation:lid .8s cubic-bezier(.3,.8,.3,1)
}
@keyframes lid{from{transform:rotateX(-75deg);opacity:.4}}
.lid-in h1{margin:0;font-size:22px;letter-spacing:.12em}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.total{margin-top:8px;font-size:14px}
.total b{font-size:18px}
.pockets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pocket{
  border:none;text-align:left;padding:12px 14px;border-radius:10px;color:var(--tag);position:relative;
  background:linear-gradient(180deg,var(--leather-l),var(--leather));
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.2),inset 0 0 0 6px var(--leather),inset 0 0 0 7px rgba(255,225,180,.35),0 3px 0 var(--leather-d)
}
.pocket:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px rgba(0,0,0,.2),inset 0 0 0 6px var(--leather),inset 0 0 0 7px rgba(255,225,180,.35)}
.pocket b{display:block;font-size:15px}
.pocket span{font-size:12px;opacity:.85;display:block;padding-right:14px}
.pocket::after{content:"›";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:22px;opacity:.8}
.hinge{height:14px;margin:0 30px;background:linear-gradient(180deg,var(--brass-d),var(--brass),var(--brass-d));border-radius:3px}

/* 本体 */
.case{background:var(--lining);border:12px solid var(--leather);border-radius:8px 8px 22px 22px;box-shadow:inset 0 0 18px rgba(0,0,0,.25);padding:10px}
.cols,.day{display:grid;grid-template-columns:58px 1fr 30% 18px;align-items:center}
.cols{color:var(--muted);font-size:11px;letter-spacing:.15em;padding:2px 10px 6px}
.day{
  width:100%;text-align:left;border:1px solid var(--lining-d);background:#fbf6ea;border-radius:12px;padding:10px;margin-bottom:8px;
  box-shadow:0 2px 0 var(--lining-d);gap:0 8px
}
.day:hover{background:#fff}
.day:active{transform:translateY(1px);box-shadow:none}
.day .chev{font-size:22px;color:var(--leather-l);text-align:right}
.date{text-align:center;border-right:2px solid var(--lining-d);align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.date .md{font-size:19px;font-weight:700;color:var(--accent);line-height:1.1}
.date .wd{font-size:11px;color:var(--muted)}
.area{font-size:12px;color:var(--muted);margin-bottom:3px}
.leg{display:grid;grid-template-columns:44px 1fr;font-variant-numeric:tabular-nums;font-size:14px}
.leg .t{font-weight:700}
.leg .by{grid-column:2;font-size:11px;color:var(--muted);border-left:2px dotted var(--muted);margin-left:-8px;padding:1px 0 1px 8px}
.leg+.leg{margin-top:6px}
.note{font-size:12px;color:var(--muted);margin-top:3px}
.cost{font-size:12px;color:var(--leather);margin-top:4px}
.chip{display:inline-block;background:var(--tag);border:1px solid var(--lining-d);border-radius:14px;padding:3px 9px;font-size:13px;word-break:break-word}
.chip{display:block}
.kind{display:inline-block;white-space:nowrap;font-size:10px;color:var(--tag);background:var(--accent);border-radius:8px;padding:1px 6px;margin-right:4px;vertical-align:1px}
.empty{color:#b09a7d;font-size:12px}
.seg{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.seg button{border:1px solid var(--leather);background:#fffaf0;color:var(--leather);border-radius:16px;padding:5px 12px;font-size:13px}
.seg button.on{background:var(--leather);color:var(--tag)}
.who{display:inline-block;font-size:10px;color:#fff;background:#2f5d8a;border-radius:8px;padding:1px 6px;margin-right:4px;vertical-align:1px}
.burden{margin-top:6px;font-size:13px}.burden tr.me td{font-weight:700}
.whos{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.whos input{width:18px;height:18px;accent-color:var(--leather);vertical-align:-3px}
.chip+.chip{margin-top:4px}
.io{display:block;font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.add{display:block;width:100%;border:2px dashed var(--leather-l);background:transparent;color:var(--leather);border-radius:12px;padding:12px;font-weight:700}
.status{color:#d9c6a6;font-size:12px;text-align:center;margin-top:12px}
.banner{background:var(--accent);color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}

/* 荷札（シート） */
.sheet-bg{position:fixed;inset:0;background:rgba(20,12,6,.6);display:none;z-index:10}
.sheet-bg.show{display:block}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);transition:transform .3s ease;
  width:min(720px,100%);max-height:92svh;overflow:auto;z-index:11;
  background:var(--tag);border-radius:18px 18px 0 0;padding:18px 18px 32px;box-shadow:0 -8px 30px rgba(0,0,0,.5)
}
.sheet:not(.show){visibility:hidden;transition:transform .3s ease,visibility 0s .3s}
.sheet.show{transform:translate(-50%,0)}
.bar{position:sticky;top:-18px;margin:-18px -18px 8px;padding:12px 18px;background:var(--tag);display:flex;gap:8px;align-items:center;z-index:1;border-bottom:1px solid var(--lining-d)}
.bar h2{margin:0;font-size:18px;flex:1}
.btn{border:none;background:var(--leather);color:var(--tag);border-radius:20px;padding:7px 14px;font-size:14px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--leather);border:1px solid var(--leather)}
.btn.danger{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.x{border:none;background:var(--lining-d);width:34px;height:34px;border-radius:50%;font-size:18px}
.sheet h3{margin:18px 0 6px;font-size:13px;letter-spacing:.1em;color:var(--leather);border-bottom:2px solid var(--lining-d);padding-bottom:4px}
.sheet ul{margin:0;padding-left:1.2em}
.sheet li{margin:4px 0}
.map{width:100%;height:240px;border:0;border-radius:10px;margin-top:6px}
.rows-t{width:100%;border-collapse:collapse;font-size:14px}
.rows-t td{padding:5px 2px;border-bottom:1px dashed var(--lining-d)}
.rows-t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.secret{white-space:pre-wrap;background:#fff;border-radius:8px;padding:12px;margin-top:10px;word-break:break-word}

/* フォーム */
label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 2px}
.in{width:100%;padding:9px 10px;border:1px solid #cdb995;border-radius:8px;background:#fff;font-size:16px}
textarea.in{min-height:76px}
.hint{font-size:11px;color:var(--muted);margin-top:2px}
.box{border:1px solid var(--lining-d);border-radius:10px;padding:10px;margin:8px 0;background:#fffaf0;position:relative}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 90px 76px 32px;gap:6px;align-items:center;margin-bottom:6px}
.rm{border:none;background:none;color:var(--accent);font-size:20px;width:32px}
.pick{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;z-index:5;background:#fff;border:1px solid #cdb995;border-radius:8px;max-height:220px;overflow:auto;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.sug div{padding:8px 10px;font-size:13px;border-bottom:1px solid #f0e6d2;cursor:pointer}
.sug div:hover,.sug div.on{background:var(--tag)}
.sug small{color:var(--muted)}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.pack li{list-style:none;margin-left:-1.2em;display:flex;align-items:center;gap:10px;padding:4px 0}
.pack label{flex:1;display:flex;gap:10px;align-items:center}
.pack input{width:20px;height:20px;accent-color:var(--leather)}
.pack .done{text-decoration:line-through;color:var(--muted)}

@media (max-width:560px){
  .cols,.day{grid-template-columns:48px 1fr 30% 14px}
  .date .md{font-size:16px}
  .day{padding:9px 8px}
  .grid3{grid-template-columns:1fr 78px 70px 28px}
}
</style>
</head>
<body>
<main>
  <div id="banner"></div>
  <div class="lid-in">
    <h1 id="title"></h1>
    <div class="sub" id="range"></div>
    <div class="total" id="total"></div>
    <div class="seg" id="seg" role="group" aria-label="誰の旅程を表示するか"></div>
    <div class="pockets">
      <button class="pocket" id="packBtn"><b>持ち物リスト</b><span id="packCount"></span></button>
      <button class="pocket" id="lockBtn"><b>個人のフライト</b><span>全便の予約情報（本人のみ）</span></button>
    </div>
  </div>
  <div class="hinge"></div>
  <div class="case">
    <div class="cols"><div>日程</div><div>フライト・移動</div><div>宿泊</div><div></div></div>
    <div id="days"></div>
    <button class="add" id="addDay">＋ 日程を追加</button>
  </div>
  <div class="status" id="status"></div>
</main>

<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script src="data.js"></script>
<script src="airports.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const WD = ["日","月","火","水","木","金","土"];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const arr = v => Array.isArray(v) ? v.filter(Boolean) : v ? Object.values(v) : [];
const local = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

let trip = structuredClone(SEED);
let openDay = null, editing = false;

// ---------- 保存先（Firebase Realtime Database の REST） ----------
const DB = FIREBASE_URL.replace(/\/$/, "");
async function api(path, method = "GET", body) {
  const r = await fetch(`${DB}/trip${path}.json`, { method, body: body === undefined ? undefined : JSON.stringify(body) });
  if (!r.ok) throw new Error(`保存先エラー ${r.status}`);
  return r.json();
}
async function save(path, value) {         // value=null で削除
  if (!DB) { setPath(path, value); render(); return; }
  try { await api(path, value === null ? "DELETE" : "PUT", value ?? undefined); setPath(path, value); render(); }
  catch (e) { alert(e.message + "\n保存できませんでした。通信を確認してください。"); }
}
function setPath(path, value) {
  const keys = path.split("/").filter(Boolean); let o = trip;
  keys.slice(0, -1).forEach(k => o = o[k] ??= {});
  value === null ? delete o[keys.at(-1)] : o[keys.at(-1)] = value;
}
async function load() {
  if (!DB) { $("#banner").innerHTML = `<div class="banner">保存先（Firebase）が未設定です。今は編集してもこの画面の中だけで、再読み込みすると消えます。</div>`; render(); return; }
  try {
    const d = await api("");
    if (d) trip = d; else await api("", "PUT", SEED);
    render();
    const es = new EventSource(`${DB}/trip.json`);     // 他の人の編集を即時反映
    let t; const refetch = () => { clearTimeout(t); t = setTimeout(async () => { trip = (await api("")) || trip; render(); }, 150); };
    es.addEventListener("put", refetch); es.addEventListener("patch", refetch);
    es.onerror = () => $("#status").textContent = "同期が切れました。再読み込みしてください。";
    es.onopen = () => $("#status").textContent = "3人で同期中";
  } catch (e) { $("#status").textContent = e.message; render(); }
}

// ---------- 為替（欧州中央銀行の参照レート、frankfurter.dev 経由） ----------
let fx = local.get("fx", null);
async function loadFx() {
  try {
    const r = await (await fetch("https://api.frankfurter.dev/v1/latest?base=EUR")).json();
    fx = { date: r.date, rates: { EUR: 1, ...r.rates } }; local.set("fx", fx); render();
  } catch { /* 取れなければ前回の値で表示 */ }
}
const CURS = ["EUR", "GBP", "JPY", "CHF", "CZK", "USD"];
const toEUR = (a, c) => fx && fx.rates[c] ? a / fx.rates[c] : (c === "EUR" ? a : NaN);
const eur = v => isNaN(v) ? "—" : "€" + v.toLocaleString("ja-JP", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const yen = v => fx && !isNaN(v) ? Math.round(v * fx.rates.JPY).toLocaleString("ja-JP") + "円" : "—";
// 費用1件: who = 負担する人（空 = 全員）、per = true なら金額は1人あたり、false なら負担者で割る合計
const payers = c => arr(c.who).length ? arr(c.who) : arr(trip.members);
const totalEUR = c => toEUR(+c.amount || 0, c.cur || "EUR") * (c.per ? payers(c).length : 1);
const shareEUR = (c, m) => payers(c).includes(m) ? toEUR(+c.amount || 0, c.cur || "EUR") / (c.per ? 1 : payers(c).length) : 0;
const sumEUR = (d, m) => arr(d.costs).reduce((s, c) => s + (m ? shareEUR(c, m) : totalEUR(c)), 0);
// 1人の負担を「個人の支出（1人あたりの金額・1人だけの費用）」と「合計を割った分」に分ける
const burden = m => days().flatMap(d => arr(d.costs)).reduce((b, c) => {
  const v = shareEUR(c, m); c.per || payers(c).length === 1 ? b.own += v : b.split += v; return b; }, { own: 0, split: 0 });

// ---------- 表示の部品 ----------
const days = () => Object.entries(trip.days || {}).map(([id, d]) => ({ id, ...d })).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
const dt = d => new Date((d.date || "2000-01-01") + "T00:00");
const md = d => `${dt(d).getMonth() + 1}/${dt(d).getDate()}`;
const wd = d => WD[dt(d).getDay()];
const place = p => esc(p?.code || p?.name || "?");
// 誰の予定か（who が空 = 全員）。上部の切り替えで1人に絞れる
let me = local.get("me", "");
const mine = x => !me || !arr(x.who).length || arr(x.who).includes(me);
const whoTag = x => arr(x.who).length && arr(x.who).length < arr(trip.members).length ? `<span class="who">${arr(x.who).map(esc).join("・")}</span>` : "";
const legsHTML = d => arr(d.legs).filter(mine).map(l => `
  <div class="leg"><span class="t">${esc(l.from?.t)}</span><span>${place(l.from)} ${whoTag(l)}</span>
  <span class="by">${esc(l.mode || "")}${l.note ? "・" + esc(l.note) : ""}</span>
  <span class="t">${esc(l.to?.t)}</span><span>${place(l.to)}</span></div>`).join("");
const staysOf = d => arr(d.stays).filter(s => s.name && mine(s));
const stayHTML = s => s?.name ? whoTag(s) + (s.kind ? `<span class="kind">${esc(s.kind)}</span>` : "") + (s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>` : esc(s.name))
  + (s.in || s.out ? `<span class="io">${s.in ? "IN " + esc(s.in) : ""}${s.in && s.out ? " / " : ""}${s.out ? "OUT " + esc(s.out) : ""}</span>` : "") : "";
// 「表示名 URL」の1行 ⇔ {text,url}
const parseLine = s => { const m = s.match(/https?:\/\/\S+/); return m ? { text: s.replace(m[0], "").trim() || m[0], url: m[0] } : { text: s.trim() }; };
const toLine = v => v.url ? `${v.text === v.url ? "" : v.text + " "}${v.url}` : v.text;
const itemHTML = v => v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.text)}</a>` : linkify(v.text);
const listHTML = (a, empty = "未定") => arr(a).length ? `<ul>${arr(a).map(v => `<li>${itemHTML(v)}</li>`).join("")}</ul>` : `<p class="empty">${empty}</p>`;

function render() {
  const ds = days();
  document.title = $("#title").textContent = trip.title || "旅";
  $("#range").textContent = ds.length ? `${ds[0].date.replaceAll("-", "/")} – ${md(ds.at(-1))}（${ds.length}日）` : "";
  const tot = ds.reduce((s, d) => s + sumEUR(d), 0);
  $("#total").innerHTML = `費用合計（全員分） <b>${eur(tot)}</b>（約${yen(tot)}）
    <table class="rows-t burden"><tr><td></td><td class="n">個人の支出</td><td class="n">合計を割った分</td><td class="n">1人の負担</td></tr>
    ${arr(trip.members).map(m => { const b = burden(m); return `<tr class="${m === me ? "me" : ""}"><td>${esc(m)}</td>
      <td class="n">${eur(b.own)}</td><td class="n">${eur(b.split)}</td><td class="n"><b>${eur(b.own + b.split)}</b><br>約${yen(b.own + b.split)}</td></tr>`; }).join("")}</table>
    <div class="sub">${fx ? `1€ = ${fx.rates.JPY}円（欧州中央銀行 ${fx.date} 時点）` : "為替レート取得中"}</div>`;
  $("#seg").innerHTML = ["", ...arr(trip.members)].map(m => `<button data-me="${esc(m)}" class="${m === me ? "on" : ""}">${m ? esc(m) : "全員"}</button>`).join("");
  $("#days").innerHTML = ds.map(d => `
    <button class="day" data-id="${d.id}">
      <div class="date"><div class="md">${md(d)}</div><div class="wd">(${wd(d)})</div></div>
      <div><div class="area">${esc(d.area)}</div>${legsHTML(d)}${d.note ? `<div class="note">${esc(d.note)}</div>` : ""}
        ${arr(d.costs).length ? `<div class="cost">${me ? `${esc(me)}の負担 ${eur(sumEUR(d, me))}（約${yen(sumEUR(d, me))}）／全員分 ` : ""}${eur(sumEUR(d))}（約${yen(sumEUR(d))}）</div>` : ""}</div>
      <div>${staysOf(d).map(s => `<span class="chip">${stayHTML(s)}</span>`).join("") || `<span class="empty">—</span>`}</div>
      <div class="chev">›</div>
    </button>`).join("") || `<p class="empty" style="text-align:center">日程がありません</p>`;
  const items = arr(trip.packing), ck = local.get("pack", {});
  $("#packCount").textContent = `${items.filter(p => ck[p.id]).length} / ${items.length} 準備済み`;
  if (openDay && !editing && $("#sheet").classList.contains("show")) trip.days?.[openDay] ? viewDay(openDay) : closeSheet();
}

// ---------- シート ----------
function openSheet(title, body, buttons = "", day = null) {
  openDay = day; $("#sheet").onclick = $("#sheet").onchange = null;
  $("#sheet").innerHTML = `<div class="bar"><h2>${title}</h2>${buttons}<button class="x" data-close aria-label="閉じる">×</button></div>${body}`;
  $("#sheet").classList.add("show"); $("#bg").classList.add("show");
}
function closeSheet() { $("#sheet").classList.remove("show"); $("#bg").classList.remove("show"); openDay = null; editing = false; }
$("#bg").onclick = closeSheet;
$("#sheet").addEventListener("click", e => e.target.closest("[data-close]") && closeSheet());
addEventListener("keydown", e => e.key === "Escape" && closeSheet());

$("#seg").onclick = e => { const b = e.target.closest("[data-me]"); if (b) { me = b.dataset.me; local.set("me", me); render(); } };
$("#days").onclick = e => { const b = e.target.closest(".day"); if (b && !e.target.closest("a")) viewDay(b.dataset.id); };
$("#addDay").onclick = () => {
  const ds = days(), last = ds.at(-1);
  const next = last ? new Date(dt(last).getTime() + 864e5) : new Date();
  const id = uid();
  openDay = id; editDay(id, { date: next.toLocaleDateString("sv-SE"), area: "", map: "" }, true);
};

// 地名でも Google マップのリンクでもよい。リンクから場所が読めれば埋め込み、読めない短縮リンクはリンクだけ出す
function mapHTML(m) {
  if (!m) return "";
  let q = m, link = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m)}`;
  if (/^https?:\/\//.test(m)) {
    link = m;
    const dec = s => decodeURIComponent(s.replace(/\+/g, " "));
    const pl = m.match(/\/place\/([^/@?]+)/), at = m.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/), qq = m.match(/[?&](?:q|query)=([^&]+)/);
    q = pl ? dec(pl[1]) : qq ? dec(qq[1]) : at ? `${at[1]},${at[2]}` : "";
  }
  return `<h3>マップ</h3>${q ? `<iframe class="map" loading="lazy" src="https://www.google.com/maps?q=${encodeURIComponent(q)}&output=embed"></iframe>`
    : `<p class="note">このリンク（短縮URLなど）からは場所を読み取れないため、地図は埋め込まずリンクで開きます。</p>`}
    <p><a href="${esc(link)}" target="_blank" rel="noopener">Googleマップで開く</a></p>`;
}

function editDay(id, d, isNew = false) {

    <label class="f">移動のメモ</label><input class="in" id="e-note" value="${esc(d.note)}" placeholder="例: PKX でトランジット">

    <div class="hint">地名のほか Google マップのURLも貼れます。ブラウザのアドレス欄の長いURLなら地図を埋め込み、共有ボタンの短いURL（maps.app.goo.gl）はリンクだけ出します。</div>

      ${isNew ? "<span></span>" : `<button class="btn danger" id="delDay">この日を削除</button>`}
      <span><button class="btn ghost" id="cancel">やめる</button> <button class="btn" id="saveDay">保存</button></span>

    $("#saveDay").disabled = true;
    await save(`/days/${id}`, v);
    trip.days?.[id] ? viewDay(id) : ($("#saveDay").disabled = false);
  };
}

// ---------- 空港・駅の候補（空港は手元の一覧、駅は Photon で世界中を検索） ----------
let sugTimer, photonCtl;
document.addEventListener("input", e => {
  const inp = e.target; if (!inp.matches("[data-p]")) return;
  inp.dataset.code = inp.dataset.lat = inp.dataset.lon = "";          // 手入力に戻ったら選択を解除
  const box = inp.nextElementSibling, q = inp.value.trim(), mode = inp.closest(".leg-f").querySelector('[data-k="mode"]').value;
  if (q.length < 2) return box.hidden = true;
  const show = list => { box.innerHTML = list.map((o, i) => `<div data-i="${i}">${o.html}</div>`).join("") || `<div class="empty">候補なし（このまま入力してもOK）</div>`; box.hidden = false; box._list = list; };
  if (mode === "飛行機") {
    const Q = q.toUpperCase(), ql = q.toLowerCase();
    const hit = AIRPORTS.filter(a => a[0] === Q).concat(AIRPORTS.filter(a => a[0] !== Q && (a[1] + " " + a[2]).toLowerCase().includes(ql))).slice(0, 12);
    show(hit.map(a => ({ name: a[0], code: a[0], lat: a[4], lon: a[5], html: `<b>${a[0]}</b> ${esc(a[1])} <small>${esc(a[2])}, ${a[3]}</small>` })));
  } else {
    clearTimeout(sugTimer);
    sugTimer = setTimeout(async () => {
      photonCtl?.abort(); photonCtl = new AbortController();
      const tag = mode === "バス" ? "amenity:bus_station" : mode === "船" ? "amenity:ferry_terminal" : "railway:station";
      try {
        const r = await (await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=8&osm_tag=${tag}`, { signal: photonCtl.signal })).json();
        show(r.features.map(f => { const p = f.properties, c = f.geometry.coordinates;
          return { name: p.name, code: "", lat: c[1], lon: c[0], html: `<b>${esc(p.name)}</b> <small>${esc([p.city, p.country].filter(Boolean).join(", "))}</small>` }; }));
      } catch (err) { if (err.name !== "AbortError") show([]); }
    }, 300);
  }
});
document.addEventListener("click", e => {
  const o = e.target.closest(".sug div[data-i]");
  if (o) { const box = o.parentElement, inp = box.previousElementSibling, v = box._list[o.dataset.i];
    inp.value = v.name; inp.dataset.code = v.code; inp.dataset.lat = v.lat; inp.dataset.lon = v.lon; box.hidden = true; return; }
  document.querySelectorAll(".sug").forEach(b => { if (!b.parentElement.contains(e.target)) b.hidden = true; });
});

  const ck = local.get("pack", {});

    <div class="grid2" style="grid-template-columns:1fr auto;margin-top:10px"><input class="in" id="newItem" placeholder="追加する物（URLも可）"><button class="btn" id="addItem">追加</button></div>`);
  const add = async () => { const t = $("#newItem").value.trim(); if (!t) return; const id = uid();
    await save(`/packing/${id}`, { id, ...parseLine(t) }); packSheet(); };

}
$("#packBtn").onclick = packSheet;

// ---------- 個人フライト（本人の合言葉で暗号化して保存） ----------
const b64e = u => btoa(String.fromCharCode(...u)), b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyOf(pass, salt, use) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, [use]);
}
async function encrypt(text, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await keyOf(pass, salt, "encrypt"), new TextEncoder().encode(text)));
  return b64e(new Uint8Array([...salt, ...iv, ...ct]));
}
async function decrypt(blob, pass) {
  const raw = b64d(blob);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(16, 28) }, await keyOf(pass, raw.slice(0, 16), "decrypt"), raw.slice(28)));
}
// 旅程の飛行機ごとに、各自の予約内容を本人の合言葉で暗号化して /private/名前/便ID に保存する
const flightsOf = n => days().flatMap(d => arr(d.legs).filter(l => l.mode === "飛行機" && (!arr(l.who).length || arr(l.who).includes(n))).map(l => ({ d, l })));
async function ensureLegIds() {          // 便に ID が無い（初期データ）なら付けて保存
  for (const d of days()) if (arr(d.legs).some(l => !l.id)) await save(`/days/${d.id}/legs`, arr(d.legs).map(l => ({ ...l, id: l.id || uid() })));
}
async function lockSheet() {
  await ensureLegIds();
  openSheet("個人のフライト", `
    <p class="note">旅程の飛行機ごとに、各自の予約内容（便名・予約番号・メールやeチケットのURLなど）を本人の合言葉で暗号化して保存します。合言葉を知らない人には読めず、忘れると誰にも戻せません。</p>
    <div class="grid2"><select class="in" id="who">${arr(trip.members).map(n => `<option ${n === me ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
      <input class="in" id="pw" type="password" placeholder="合言葉" autocomplete="current-password"></div>
    <div style="margin-top:8px"><button class="btn" id="unlock">開く</button></div><div id="out"></div>`);
  const go = async () => {
    const n = $("#who").value, pw = $("#pw").value, saved = trip.private?.[n];
    if (!pw) return;
    const blobs = saved && typeof saved === "object" ? saved : {}, plain = {};
    try { for (const [k, b] of Object.entries(blobs)) plain[k] = await decrypt(b, pw); }
    catch { return $("#out").innerHTML = `<p class="note" style="color:var(--accent)">合言葉が違います</p>`; }
    const fl = flightsOf(n);
    $("#out").innerHTML = (Object.keys(blobs).length ? "" : `<p class="note">${esc(n)} はまだ登録がありません。今入れた合言葉で登録されます。</p>`)
      + fl.map(({ d, l }) => `<div class="box"><b>${md(d)} (${wd(d)})</b>　${esc(l.from?.t)} ${place(l.from)} → ${esc(l.to?.t)} ${place(l.to)}
          ${plain[l.id] ? `<div class="secret">${linkify(plain[l.id])}</div>` : `<p class="empty">未登録</p>`}
          <details ${plain[l.id] ? "" : "open"}><summary class="note">書く・直す</summary>
          <textarea class="in" data-leg="${esc(l.id)}" placeholder="便名・予約番号・メールのURL など">${esc(plain[l.id] || "")}</textarea></details></div>`).join("")
      + (fl.length ? `<button class="btn" id="sealAll">暗号化して保存</button>` : `<p class="empty">${esc(n)} の飛行機の便が旅程にありません</p>`);
    if (!fl.length) return;
    $("#sealAll").onclick = async () => {
      const v = {};
      for (const t of document.querySelectorAll("[data-leg]")) if (t.value.trim()) v[t.dataset.leg] = await encrypt(t.value.trim(), pw);
      await save(`/private/${n}`, Object.keys(v).length ? v : null); go();
    };
  };
  $("#unlock").onclick = go; $("#pw").onkeydown = e => { if (e.key === "Enter" && !e.isComposing) go(); };
}
$("#lockBtn").onclick = lockSheet;

render(); load(); loadFx(); setInterval(loadFx, 60 * 60 * 1000);
